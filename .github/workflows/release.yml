# Builds a signed release APK when a tag like v0.1.0 is pushed and attaches it to
# the GitHub release. Signing secrets (Settings → Secrets and variables → Actions):
#   SIGNING_KEYSTORE_BASE64  base64 of the .jks keystore
#   SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}"
          } > keystore.properties

      - name: Build
        run: ./gradlew :androidApp:assembleRelease --console=plain

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "remote-for-cider-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "remote-for-cider-${GITHUB_REF_NAME}.apk" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "remote-for-cider-${GITHUB_REF_NAME}.apk" --clobber
