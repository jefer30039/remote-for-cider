# App de iOS: compila shared (XCFramework con SKIE) y la app de SwiftUI en un runner macOS,
# sube el .ipa sin firmar (se instala con SideStore) y, si está el secreto DEMO_FIXTURES_KEY,
# capturas y vídeos del simulador contra un Cider de demostración (iosApp/Demo).
name: iOS

on:
  push:
    branches: [ios]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # Imagen de Xcode 27 (macOS 27, SDK de iOS 27). Es el runner estándar, gratis en repositorios
    # públicos; NO usar xcode-27-xlarge (runner grande, se cobra aunque el repositorio sea público).
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      SIM_DEVICE: iPhone 18 Pro Max   # el iPhone del usuario
      SIM_RUNTIME: iOS-27
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS

      # El simulador tarda ~7 min en arrancar: se arranca ya, en segundo plano, mientras se compila.
      # demo.sh espera con `bootstatus` a que termine (SIM_UDID).
      - name: Boot the simulator (background)
        run: |
          mkdir -p build
          UDID=$(iosApp/ci/sim.sh)
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          nohup sh -c "xcrun simctl boot $UDID; xcrun simctl bootstatus $UDID -b" > build/sim-boot.log 2>&1 &
          echo "Arrancando $SIM_DEVICE: $UDID"

      - name: Shared tests (JVM)
        run: ./gradlew :shared:jvmTest --console=plain --no-configuration-cache -Pkotlin.apple.xcodeCompatibility.nowarn=true

      - name: Shared.xcframework
        run: |
          set -o pipefail
          mkdir -p build
          ./gradlew :shared:assembleSharedReleaseXCFramework --console=plain --no-configuration-cache -Pkotlin.apple.xcodeCompatibility.nowarn=true 2>&1 | tee build/gradle-xcframework.log

      # Qué ve Swift del framework: cabecera de Objective-C, interfaz de Swift y código que genera SKIE.
      - name: Inspect Shared.xcframework
        if: always()
        run: |
          F=shared/build/XCFrameworks/release/Shared.xcframework
          mkdir -p build/shared-api
          find "$F" -maxdepth 4 | head -40
          FW="$F/ios-arm64/Shared.framework"
          cp -R "$FW/Headers" build/shared-api/ || true
          cp -R "$FW/Modules" build/shared-api/ || true
          find shared/build -path "*skie*" -name "*.swift" -path "*iosArm64*" | head -400 | xargs -I{} cp {} build/shared-api/ 2>/dev/null || true
          echo "--- Objective-C (albums / request):"
          grep -n "albums\|requestHost\|request(host" "$FW/Headers/Shared.h" | head -20 || true
          echo "--- Swift (albums / request):"
          grep -rn "func albums\|func request" build/shared-api | head -20 || true

      - name: Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build for the simulator
        run: |
          mkdir -p build
          status=0
          xcodebuild -project iosApp/RemoteForCider.xcodeproj -scheme RemoteForCider \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd-sim build-for-testing > build/xcodebuild-sim.log 2>&1 || status=$?
          grep -E "error:|warning: .*\.swift|\*\* .* \*\*" build/xcodebuild-sim.log | sort -u || true
          test $status -eq 0
          test -f build/dd-sim/Build/Products/Debug-iphonesimulator/RemoteForCider.app/RemoteForCider

      - name: Build unsigned .ipa
        run: |
          status=0
          xcodebuild -project iosApp/RemoteForCider.xcodeproj -scheme RemoteForCider \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd-ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild-ios.log 2>&1 || status=$?
          grep -E "error:|\*\* .* \*\*" build/xcodebuild-ios.log | sort -u || true
          test $status -eq 0
          APP=build/dd-ios/Build/Products/Release-iphoneos/RemoteForCider.app
          test -f "$APP/RemoteForCider"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../remote-for-cider-ios-unsigned.ipa Payload)
          ls -la build/remote-for-cider-ios-unsigned.ipa

      - name: Simulator screenshots and videos (demo Cider)
        env:
          DEMO_FIXTURES_KEY: ${{ secrets.DEMO_FIXTURES_KEY }}
        run: |
          if [ -z "$DEMO_FIXTURES_KEY" ]; then
            echo "No DEMO_FIXTURES_KEY secret: skipping the demo screenshots."
            exit 0
          fi
          iosApp/ci/demo.sh build/dd-sim/Build/Products/Debug-iphonesimulator/RemoteForCider.app build/demo \
            "$(ls build/dd-sim/Build/Products/*.xctestrun | head -1)"

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: remote-for-cider-ios-unsigned
          path: build/remote-for-cider-ios-unsigned.ipa
          retention-days: 30

      # Muestran la biblioteca del usuario y letras: 7 días y se borran solos.
      - name: Upload screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-demo
          path: build/demo
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/xcodebuild-*.log
            build/gradle-xcframework.log
            build/shared-api
            shared/build/reports
          retention-days: 7
          if-no-files-found: ignore
